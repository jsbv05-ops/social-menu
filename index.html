<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Carta digital de Social Drinks & Coffee: cócteles, cafés, bocados y más.">
<link rel="icon" href="logo.png">
<title>Carta Social D&amp;C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Colores de Social: negro, blanco, verde pino, gris oscuro. Un solo tema, siempre. */
:root{
  color-scheme: dark;
  --black:#0b0b0b; --graphite:#1c1d1c; --graphite-2:#262826; --line:#323532;
  --white:#ffffff; --soft:#b9bdb9; --muted:#8a8f8a;
  --pine:#1f5c45; --pine-2:#2b7a5c; --pine-ink:#8fd1b0;
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--black)}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pine-ink);outline-offset:3px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:32px}}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,11,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo-sm{height:34px;width:auto;display:block}
.icon-btn{border:1px solid var(--line);background:var(--graphite);border-radius:999px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--graphite);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--white);font:inherit;padding:10px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;color:var(--soft);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.tab[aria-current="page"]{background:var(--white);color:var(--black);border-color:var(--white)}

/* ---------- Páginas ---------- */
main{padding-bottom:120px;min-height:70vh}
.page{animation:enter .35s ease both}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding-block:30px 8px;display:grid;gap:18px;justify-items:center;text-align:center}
.logo-lg{width:min(360px,82vw);height:auto;display:block}
.hero p{margin:0;color:var(--soft);max-width:36ch;text-wrap:balance}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--graphite);border-radius:999px;padding:12px 20px;font-weight:700;text-decoration:none;color:var(--white);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pine{background:var(--pine);border-color:var(--pine-2)}
.btn.pine:hover{background:var(--pine-2)}
.btn.ghost{background:transparent}
.head{padding-top:30px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.head h1,.head h2{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,10vw,4rem);line-height:.9;margin:0;letter-spacing:.02em}
.head .count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.note{color:var(--soft);margin:8px 0 0;font-size:.92rem}

.flavors{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.flavor{border:1px solid var(--line);background:var(--graphite);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--soft)}
.flavor[aria-pressed="true"]{background:var(--pine);border-color:var(--pine-2);color:var(--white)}
.flavor.reset{background:transparent;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;border:1px solid var(--line);background:var(--graphite);border-radius:var(--radius);padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--pine-2)}
.card .art{height:118px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 72%,#223a30,transparent 68%)}
.card .art svg{height:110px;width:auto}
.card h3{margin:6px 0 0;font-size:1rem;line-height:1.2;font-weight:700}
.card .desc{margin:0;color:var(--soft);font-size:.8rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;margin-top:auto;padding-top:8px}
.card-open{position:absolute;inset:0;border:0;background:transparent;border-radius:var(--radius);z-index:1}
.card .heart{position:absolute;top:8px;right:8px}
.badge{position:absolute;top:10px;left:10px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:var(--white);color:var(--black);border-radius:999px;padding:3px 8px;font-weight:800}
.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pine-ink);font-weight:700}
.price{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.hide{display:none!important}

.group{margin-top:20px}
.group h3{margin:0 0 2px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pine-ink);font-weight:800}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .d{display:block;color:var(--muted);font-size:.84rem;line-height:1.35;margin-top:2px}
.cols{display:grid;gap:0 44px}
@media (min-width:820px){.cols{grid-template-columns:1fr 1fr}}

.heart{position:relative;z-index:2;border:0;background:transparent;padding:6px;margin:-6px;color:var(--muted)}
.heart svg{width:20px;height:20px;display:block}
.heart[aria-pressed="true"]{color:var(--pine-ink)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.heart.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}

.quiz-strip{margin-top:28px;border:1px solid var(--pine-2);background:linear-gradient(135deg,#143b2d,var(--graphite) 70%);border-radius:var(--radius);padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.quiz-strip b{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.02em;line-height:1}
.quiz-strip span{display:block;color:var(--soft);font-size:.9rem;margin-top:4px}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:36px;flex-wrap:wrap}
.foot-note{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);margin-top:40px;padding-top:16px}
.empty{color:var(--muted);text-align:center;margin-top:40px}

/* ---------- Ronda ---------- */
.ronda-btn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--white);color:var(--black);border:0;border-radius:999px;padding:12px 18px 12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:0 12px 30px -10px rgba(0,0,0,.8)}
.ronda-btn .n{background:var(--pine);color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;padding:0 6px}
.ronda-btn svg{width:18px;height:18px}

/* ---------- Hojas ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:90vh;overflow:auto;background:var(--graphite);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
@media (min-width:720px){.sheet{left:50%;right:auto;width:540px;transform:translate(-50%,105%)}.sheet.on{transform:translate(-50%,0)}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.x{position:absolute;top:12px;right:14px;border:0;background:var(--graphite-2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;z-index:2}
.x svg{width:16px;height:16px}
.detail-art{height:200px;display:grid;place-items:center;background:radial-gradient(circle at 50% 72%,#223a30,transparent 62%)}
.detail-art svg{height:190px;width:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:.95;margin:6px 0 4px;letter-spacing:.02em}
.sheet p{color:var(--soft);margin:10px 0 0}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.ing li{background:var(--graphite-2);border-radius:999px;padding:5px 11px;font-size:.84rem}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sheet-foot .price{font-size:1.4rem}

/* Cuestionario */
.q-step{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pine-ink);font-weight:800;margin-top:4px}
.q-dots{display:flex;gap:6px;margin-top:8px}
.q-dots i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.q-dots i.on{background:var(--pine-2)}
.q-opts{display:grid;gap:10px;margin-top:18px}
.q-opt{text-align:left;border:1px solid var(--line);background:var(--graphite-2);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:border-color .2s,background .2s,transform .15s}
.q-opt:hover{border-color:var(--pine-2)}
.q-opt:active{transform:scale(.98)}
.q-opt svg{width:28px;height:28px;flex:0 0 auto;color:var(--pine-ink)}
.q-opt b{display:block}
.q-opt small{display:block;color:var(--muted);font-size:.82rem}
.q-back{border:0;background:none;color:var(--muted);padding:10px 0 0;font-size:.88rem}
.pick-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pick-why span{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--soft)}
.pair{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.pair small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.alts{margin-top:12px;color:var(--muted);font-size:.86rem}
.alts button{border:0;background:none;color:var(--pine-ink);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.q-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

.r-list{list-style:none;margin:12px 0 0;padding:0}
.r-item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--graphite-2);border-radius:999px;padding:3px}
.qty button{border:0;background:var(--black);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.qty button svg{width:14px;height:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-weight:800}
.total .price{font-size:1.5rem}
.hint{color:var(--muted);font-size:.84rem;margin-top:8px}

.liquid{transform-box:fill-box;transform-origin:50% 100%}
.pour .liquid{animation:pourIn 1s cubic-bezier(.3,.7,.3,1) both}
@keyframes pourIn{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a href="#cocteles" aria-label="Social Drinks and Coffee, inicio"><img class="logo-sm" src="logo.png" alt="Social Drinks and Coffee"></a>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="btn-search" type="button" aria-label="Buscar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="btn-quiz-top" type="button" aria-label="¿Qué me tomo hoy?" style="background:var(--pine);border-color:var(--pine-2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.1 9a3 3 0 1 1 4.3 2.7c-.9.4-1.4 1.2-1.4 2.1V15M12 18.5v.01"/><circle cx="12" cy="12" r="10"/></svg></button>
      </div>
    </div>
    <label class="search" for="q" id="search-box" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Busca en toda la carta…" autocomplete="off">
    </label>
    <nav class="tabs" id="tabs" aria-label="Categorías"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="ronda-btn" id="ronda-btn" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>
  Mi ronda <span class="n" id="ronda-n">0</span>
</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab"></div>
  <button class="x" id="sheet-x" type="button" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div id="sheet-body"></div>
</section>

<script>

let gid = 0;
function glassSVG(it){
  const id = "g" + (++gid), c1 = it.c1 || "#2b7a5c", c2 = it.c2 || c1, foam = it.foam;
  const grad = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
  const stroke = `stroke="rgba(255,255,255,.6)" stroke-width="2" fill="rgba(255,255,255,.04)"`;
  const garnish = (x,y) => {
    if(it.garnish === "cherry") return `<line x1="${x}" y1="${y}" x2="${x+6}" y2="${y-14}" stroke="#4d7a3a" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="5" fill="#b3122e"/>`;
    const col = it.garnish === "orange" ? "#f29a2e" : it.garnish === "lime" ? "#8fbf3a" : "#e8d64a";
    return it.garnish ? `<circle cx="${x}" cy="${y}" r="10" fill="${col}"/><circle cx="${x}" cy="${y}" r="7" fill="#fff" opacity=".35"/><path d="M${x-7} ${y}h14M${x} ${y-7}v14" stroke="${col}" stroke-width="1.2"/>` : "";
  };
  let liquid = "", body = "", extra = "";
  switch(it.glass){
    case "highball":
      liquid = `<g class="liquid"><rect x="37" y="34" width="36" height="92" rx="3" fill="url(#${id})"/>${foam?`<rect x="37" y="34" width="36" height="12" fill="#fbf7ec"/>`:""}</g><rect x="41" y="60" width="11" height="11" rx="2" fill="#fff" opacity=".22"/><rect x="55" y="80" width="11" height="11" rx="2" fill="#fff" opacity=".18"/>`;
      body = `<path d="M34 22h42l-3 108H37z" ${stroke}/>`;
      extra = `<line x1="62" y1="6" x2="54" y2="110" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` + garnish(76,26); break;
    case "zombie":
      liquid = `<g class="liquid"><rect x="42" y="26" width="26" height="102" rx="3" fill="url(#${id})"/>${foam?`<rect x="42" y="26" width="26" height="12" fill="#fbf7ec"/>`:""}</g><rect x="46" y="56" width="9" height="9" rx="2" fill="#fff" opacity=".22"/><rect x="55" y="84" width="9" height="9" rx="2" fill="#fff" opacity=".18"/>`;
      body = `<path d="M39 12h32l-2 120H41z" ${stroke}/>`;
      extra = `<line x1="62" y1="0" x2="54" y2="112" stroke="#fff" stroke-width="3" stroke-linecap="round"/>` + garnish(72,16); break;
    case "wine":
      liquid = `<g class="liquid"><path d="M33 52 Q33 88 55 90 Q77 88 77 52Z" fill="url(#${id})"/></g>`;
      body = `<path d="M34 22 Q22 86 55 92 Q88 86 76 22Z" ${stroke}/><line x1="55" y1="92" x2="55" y2="124" stroke="rgba(255,255,255,.6)" stroke-width="2.4"/><ellipse cx="55" cy="127" rx="18" ry="3.5" ${stroke}/>`;
      extra = garnish(76,28); break;
    case "coupe":
      liquid = `<g class="liquid"><path d="M26 60 Q55 104 84 60Z" fill="url(#${id})"/></g>`;
      body = `<path d="M20 52 Q55 116 90 52Z" ${stroke}/><line x1="55" y1="84" x2="55" y2="124" stroke="rgba(255,255,255,.6)" stroke-width="2.4"/><ellipse cx="55" cy="127" rx="18" ry="3.5" ${stroke}/>`;
      extra = (it.salt ? `<path d="M20 52h70" stroke="#fff" stroke-width="3" stroke-dasharray="2 2"/>` : "") + `<path d="M86 52a9 9 0 0 1-12 -2" stroke="#8fbf3a" stroke-width="5" fill="none" stroke-linecap="round"/>`; break;
    case "mug":
      body = `<defs><linearGradient id="${id}c" x1="0" x2="1"><stop offset="0" stop-color="#e39a5e"/><stop offset=".5" stop-color="#c4713d"/><stop offset="1" stop-color="#8e4b26"/></linearGradient></defs><path d="M78 64c14 0 14 34 0 34" stroke="#a65a2e" stroke-width="6" fill="none"/><rect x="26" y="50" width="54" height="76" rx="7" fill="url(#${id}c)"/><ellipse cx="53" cy="50" rx="27" ry="5" fill="${c1}" class="liquid"/><rect x="32" y="58" width="6" height="58" rx="3" fill="#fff" opacity=".25"/>`;
      extra = `<path d="M46 50 l-8 -16 M52 49 l2 -18" stroke="#5f8f45" stroke-width="5" stroke-linecap="round"/>` + garnish(70,46); break;
    case "shots":
      liquid = `<g class="liquid"><rect x="20" y="78" width="28" height="48" rx="2" fill="${c1}"/><rect x="62" y="78" width="28" height="48" rx="2" fill="${c1}"/></g>`;
      body = `<path d="M16 62h36l-3 68H19z" ${stroke}/><path d="M58 62h36l-3 68H61z" ${stroke}/>`;
      extra = `<text x="34" y="50" text-anchor="middle" font-family="Impact,sans-serif" font-size="26" fill="#fff">?</text><text x="76" y="50" text-anchor="middle" font-family="Impact,sans-serif" font-size="26" fill="#fff">?</text>`; break;
    default:
      liquid = `<g class="liquid"><rect x="29" y="70" width="52" height="54" rx="2" fill="url(#${id})"/>${foam?`<rect x="29" y="70" width="52" height="9" fill="#fbf7ec"/>`:""}</g><rect x="35" y="84" width="16" height="16" rx="3" fill="#fff" opacity=".22" transform="rotate(-8 43 92)"/><rect x="56" y="92" width="15" height="15" rx="3" fill="#fff" opacity=".18" transform="rotate(10 63 99)"/>`;
      body = `<path d="M25 58h60l-4 70H29z" ${stroke}/>`;
      extra = garnish(80,64);
  }
  return `<svg viewBox="0 0 110 134" aria-hidden="true"><defs>${grad}</defs>${liquid}${body}${extra}</svg>`;
}

    html = `<div class="head"><h1>${cat.title}</h1><span class="count">${n}</span></div>${cat.note?`<p class="note">${cat.note}</p>`:""}
      <div class="${groups.length>1?"cols":""}">${groups.map(g=>`<div class="group">${g.name?`<h3>${g.name}</h3>`:""}<ul class="list">${g.items.map(rowHTML).join("")}</ul></div>`).join("")}</div>
      <div class="quiz-strip"><div><b>¿Indeciso?</b><span>Responde hasta tres preguntas y te recomendamos algo.</span></div><button class="btn pine" type="button" data-quiz>${ICON.q}¿Qué me tomo hoy?</button></div>`;
  }
  html += nextLinks(cat.id) + `<p class="foot-note">Social Drinks &amp; Coffee · Precios en pesos colombianos. Pregunta por la disponibilidad en barra.</p>`;
  $("#view").innerHTML = `<div class="page">${html}</div>`;
  renderTabs(cat.id); applyFlavors(); window.scrollTo({top:0});
}
function applyFlavors(){
  if(!$("#grid")) return;
  document.querySelectorAll("#grid .card").forEach(el => {
    const c = ALL[el.dataset.item];
    el.classList.toggle("hide", activeFlavors.size > 0 && ![...activeFlavors].every(f => c.t.includes(f)));
  });
  const r = $("#flavor-reset"); if(r) r.hidden = !activeFlavors.size;
}
function renderSearch(q){
  const nq = norm(q);
  const res = Object.values(ALL).filter(i => norm(i.name+" "+(i.desc||i.d||"")+" "+(i.ing||[]).join(" ")).includes(nq));
  const byCat = CATS.map(c => ({c, items: res.filter(i=>i.cat===c.id)})).filter(x=>x.items.length);
  $("#view").innerHTML = `<div class="page"><div class="head"><h1>Resultados</h1><span class="count">${res.length}</span></div>
    ${byCat.length ? byCat.map(x=>`<div class="group"><h3>${x.c.title}</h3><ul class="list">${x.items.map(i=> i.cat==="cocteles"
      ? `<li class="row" data-item="${i.id}"><button type="button" data-open="${i.id}" style="all:unset;cursor:pointer"><span class="name">${i.name}</span><span class="d">${i.desc||""}</span></button><span class="price">${fmt(i.price)}</span>${heartBtn(i.id)}</li>`
      : rowHTML(i)).join("")}</ul></div>`).join("") : `<p class="empty">No encontramos "${q.replace(/</g,"&lt;")}". Prueba con otra palabra.</p>`}</div>`;
  document.querySelectorAll("#tabs .tab").forEach(t=>t.removeAttribute("aria-current"));
}
function route(){
  const q = $("#q").value.trim();
  if(q) return renderSearch(q);
  const id = location.hash.replace("#","");
  renderPage(CATS.some(c=>c.id===id) ? id : "cocteles");
}

/* ---------- Hojas ---------- */
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  $("#sheet-body").innerHTML = html;
  const sh = $("#sheet"); sh.hidden = false;
  requestAnimationFrame(() => { sh.classList.add("on"); $("#scrim").classList.add("on"); });
  setTimeout(() => $("#sheet-x").focus(), 60);
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  setTimeout(() => { $("#sheet").hidden = true; }, 320);
  if(lastFocus) lastFocus.focus();
}
function detailHTML(it){
  return `<div class="detail-art pour">${glassSVG(it)}</div><h2 id="sheet-title">${it.name}</h2>
    <div class="pick-why">${it.t.filter(x=>FLAVORS[x]).map(x=>`<span>${FLAVORS[x]}</span>`).join("")}${it.badge?`<span>${it.badge}</span>`:""}</div>
    <p>${it.desc||""}</p>${it.ing?`<ul class="ing">${it.ing.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    <div class="sheet-foot"><span class="price">${fmt(it.price)}</span>
    <button class="btn pine" type="button" data-toggle-ronda="${it.id}">${ICON.heart}${ronda[it.id]?"En tu ronda":"Agregar a mi ronda"}</button></div>`;
}

/* =========================================================
   ¿QUÉ ME TOMO HOY? — árbol de máximo 3 preguntas.
   Cada respuesta decide la siguiente pregunta.
   ========================================================= */
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pickText = arr => arr[Math.floor(Math.random()*arr.length)];
const Q = {
  inicio: () => ({
    title: pickText(["¿Qué se te antoja?","¿Cómo viene el antojo?","Empecemos: ¿qué te provoca?"]),
    opts: [
      {icon:"hot",   label:"Algo caliente", sub:"Café, chocolate", why:"Caliente", next:"caliente"},
      {icon:"cold",  label:"Algo frío sin alcohol", sub:"Batidos, sodas, café frío", why:"Frío sin alcohol", next:"frioSin"},
      {icon:"cocktail", label:"Algo con alcohol", sub:"Cócteles, cervezas, shots", why:"Con alcohol", next:"alcohol"},
      {icon:"food",  label:"Algo para comer", sub:"Bocados y postres", why:"Para comer", next:"comer"}
    ]}),
  caliente: () => ({
    title: pickText(["¿Cómo te gusta el café?","¿Qué tan intenso lo quieres?"]),
    opts: shuffle([
      {icon:"bitter", label:"Intenso y amargo", sub:"Café puro", why:"Amargo", pool:["intenso"], next:"acompanar"},
      {icon:"milk",   label:"Suave, con leche", sub:"Cremoso y tranquilo", why:"Con leche", pool:["suave"], next:"acompanar"},
      {icon:"sweet",  label:"Dulce, con chocolate", sub:"Para consentirse", why:"Dulce", pool:["chocolate"], next:"acompanar"}
    ])}),
  acompanar: () => ({
    title: pickText(["¿Lo acompañas con algo?","¿Y para acompañar?"]),
    opts: [
      {icon:"salt",  label:"Sí, algo salado", sub:"Empanada, arepa o palito", why:"Con algo salado", pair:["salado","picar"]},
      {icon:"sweet", label:"Sí, algo dulce", sub:"Torta o helado", why:"Con algo dulce", pair:["postre"]},
      {icon:"none",  label:"Solo la bebida", why:"Solo bebida"}
    ]}),
  frioSin: () => ({
    title: pickText(["¿Café frío o algo frutal?","¿Por dónde vamos?"]),
    opts: shuffle([
      {icon:"milk",  label:"Algo con café o chocolate", sub:"Frío y cremoso", why:"Café frío", next:"cafeFrio"},
      {icon:"fruit", label:"Algo frutal", sub:"Sodas y batidos", why:"Frutal", next:"frutal"}
    ])}),
  cafeFrio: () => ({
    title: "¿Cómo lo prefieres?",
    opts: [
      {icon:"sweet", label:"Bien dulce y cremoso", why:"Dulce", pool:["dulcefrio"]},
      {icon:"cold",  label:"Con helado", sub:"Mitad bebida, mitad postre", why:"Con helado", pool:["conhelado"]}
    ]}),
  frutal: () => ({
    title: pickText(["¿Dulce o ácido?","¿Qué sabor buscas?"]),
    opts: shuffle([
      {icon:"sweet", label:"Dulce", why:"Dulce", pool:["frutal","dulce"]},
      {icon:"sour",  label:"Ácido y refrescante", why:"Ácido", pool:["frutal","acido"]}
    ])}),
  alcohol: () => ({
    title: pickText(["¿Qué sabor te llama?","¿Por cuál sabor vas hoy?"]),
    opts: shuffle([
      {icon:"sweet",  label:"Dulce", sub:"Frutal o cremoso", why:"Dulce", next:"alcDulce"},
      {icon:"sour",   label:"Ácido", sub:"Cítrico y fresco", why:"Ácido", next:"alcAcido"},
      {icon:"bitter", label:"Amargo", sub:"Más seco, más carácter", why:"Amargo", next:"alcAmargo"},
      {icon:"salt",   label:"Salado", sub:"Con borde de sal o michelado", why:"Salado", next:"alcSalado"}
    ])}),
  alcDulce: () => ({
    title: "¿Tropical o cremoso?",
    opts: shuffle([
      {icon:"fruit", label:"Tropical", sub:"Frutas y color", why:"Tropical", pool:["coctel","dulce","tropical"]},
      {icon:"milk",  label:"Cremoso", sub:"Suave, con leche o coco", why:"Cremoso", pool:["coctel","dulce","cremoso"]}
    ])}),
  alcAcido: () => ({
    title: pickText(["¿Largo o corto?","¿Cómo lo quieres servido?"]),
    opts: shuffle([
      {icon:"long",  label:"Largo y refrescante", sub:"Con hielo y soda, para ir despacio", why:"Largo", pool:["coctel","acido","largo"]},
      {icon:"short", label:"Corto e intenso", sub:"Menos volumen, más sabor", why:"Corto", pool:["coctel","acido","corto"]}
    ])}),
  alcAmargo: () => ({
    title: "¿Cómo lo quieres?",
    opts: shuffle([
      {icon:"cocktail", label:"En cóctel", why:"Cóctel", pool:["coctel","amargo"]},
      {icon:"beer",  label:"Una cerveza fría", why:"Cerveza", pool:["cerveza"]},
      {icon:"shot",  label:"Un trago directo", why:"Shot", pool:["shot"]}
    ])}),
  alcSalado: () => ({
    title: "¿Cóctel o cerveza?",
    opts: shuffle([
      {icon:"cocktail", label:"Cóctel con borde de sal", why:"Cóctel", pool:["coctel","salado"]},
      {icon:"beer", label:"Cerveza michelada", why:"Michelada", pool:["cerveza"], pair:["michelada"]}
    ])}),
  comer: () => ({
    title: pickText(["¿Dulce o salado?","¿Qué se te antoja comer?"]),
    opts: shuffle([
      {icon:"salt",  label:"Salado", why:"Salado", next:"comerSalado"},
      {icon:"sweet", label:"Dulce", why:"Dulce", next:"comerDulce"}
    ])}),
  comerSalado: () => ({
    title: "¿Algo para picar o que llene?",
    opts: shuffle([
      {icon:"food", label:"Para picar", sub:"Pequeño, para compartir", why:"Para picar", pool:["salado","picar"]},
      {icon:"food", label:"Que llene", sub:"Algo más contundente", why:"Que llene", pool:["salado","llenar"]}
    ])}),
  comerDulce: () => ({
    title: "¿Frío o de horno?",
    opts: shuffle([
      {icon:"cold",  label:"Frío", sub:"Helado y cremas", why:"Frío", pool:["postrefrio"]},
      {icon:"sweet", label:"De horno", sub:"Torta", why:"De horno", pool:["horno"]}
    ])})
};
let quiz;
const matches = tags => shuffle(Object.values(ALL).filter(i => tags.every(t => i.t.includes(t))));
function startQuiz(){ quiz = {path:[], why:[], pool:null, pair:null, idx:0}; showQ("inicio", Q.inicio()); }
function showQ(key, q){
  quiz.cur = {key, q};
  const step = quiz.path.length + 1;
  openOrUpdate(`<div class="q-step" id="sheet-title-pre">Pregunta ${step}</div>
    <div class="q-dots">${[1,2,3].map(n=>`<i class="${n<=step?"on":""}"></i>`).join("")}</div>
    <h2 id="sheet-title">${q.title}</h2>
    <div class="q-opts">${q.opts.map((o,i)=>`<button class="q-opt" type="button" data-qopt="${i}">${ICON[o.icon]||""}<span><b>${o.label}</b>${o.sub?`<small>${o.sub}</small>`:""}</span></button>`).join("")}</div>
    ${quiz.path.length?`<button class="q-back" type="button" data-qback>← Volver</button>`:""}`);
}
function openOrUpdate(html){ if($("#sheet").classList.contains("on")) $("#sheet-body").innerHTML = html; else openSheet(html); }
function answer(i){
  const o = quiz.cur.q.opts[i];
  quiz.path.push({key:quiz.cur.key, q:quiz.cur.q});
  quiz.why.push(o.why);
  if(o.pool) quiz.pool = o.pool;
  if(o.pair) quiz.pair = o.pair;
  if(o.next && quiz.path.length < 3) return showQ(o.next, Q[o.next]());
  if(!quiz.pool){ // caliente → acompañar ya definió pool en el paso anterior
    quiz.pool = ["caliente"];
  }
  showResult();
}
function back(){
  const prev = quiz.path.pop(); quiz.why.pop();
  quiz.pool = null; quiz.pair = null;
  // recalcula pool/pair con las respuestas previas guardadas
  quiz.answers = (quiz.answers||[]).slice(0, quiz.path.length);
  quiz.answers.forEach(o => { if(o.pool) quiz.pool = o.pool; if(o.pair) quiz.pair = o.pair; });
  showQ(prev.key, prev.q);
}
function showResult(){
  quiz.list = matches(quiz.pool);
  if(!quiz.list.length) quiz.list = matches(["coctel"]);
  const rank = x => { const i = PRIORIDAD.indexOf(x.id); return i < 0 ? 99 : i; };
  quiz.list.sort((a,b) => rank(a) - rank(b));
  quiz.idx = 0;
  quiz.pairItem = quiz.pair ? matches(quiz.pair)[0] : null;
  renderResult();
}
function renderResult(){
  const it = quiz.list[quiz.idx % quiz.list.length];
  const alts = quiz.list.filter(x=>x!==it).slice(0,2);
  const hasGlass = it.cat === "cocteles";
  const casa = quiz.why[0] === "Con alcohol" ? PRIORIDAD.map(id => ALL[id]).find(x => x && !quiz.list.includes(x)) : null;
  $("#sheet-body").innerHTML = `
    <div class="q-step">Te recomendamos</div>
    ${hasGlass?`<div class="detail-art pour">${glassSVG(it)}</div>`:""}
    <h2 id="sheet-title">${it.name}</h2>
    <div class="pick-why">${quiz.why.map(w=>`<span>${w}</span>`).join("")}</div>
    ${it.desc||it.d?`<p>${it.desc||it.d}</p>`:""}
    ${quiz.pairItem && quiz.pairItem.id!==it.id?`<div class="pair"><span><small>Acompáñalo con</small><b>${quiz.pairItem.name}</b></span><span class="price">${fmt(quiz.pairItem.price)}</span></div>`:""}
    ${alts.length?`<p class="alts">También te puede gustar: ${alts.map(a=>`<button type="button" data-alt="${a.id}">${a.name}</button>`).join(" · ")}</p>`:""}
    ${casa?`<p class="alts">El favorito de la casa: <button type="button" data-casa="${casa.id}">${casa.name}</button></p>`:""}
    <div class="sheet-foot"><span class="price">${fmt(it.price)}</span>
      <button class="btn pine" type="button" data-toggle-ronda="${it.id}" data-from-quiz>${ICON.heart}${ronda[it.id]?"En tu ronda":"Agregar a mi ronda"}</button></div>
    <div class="q-actions">${quiz.list.length>1?`<button class="btn" type="button" data-qother>Otra opción</button>`:""}<button class="btn ghost" type="button" data-quiz>Empezar de nuevo</button></div>`;
}

/* ---------- Ronda ---------- */
function rondaHTML(){
  const ids = Object.keys(ronda); let total = 0;
  const rows = ids.map(id => { const it = ALL[id], q = ronda[id]; total += it.price*q;
    return `<li class="r-item"><span><b>${it.name}</b><span style="display:block;color:var(--muted);font-size:.84rem">${fmt(it.price)} c/u</span></span>
      <span class="qty"><button type="button" data-q="${id}" data-d="-1" aria-label="Quitar uno">${ICON.minus}</button><span>${q}</span><button type="button" data-q="${id}" data-d="1" aria-label="Agregar uno">${ICON.plus}</button></span>
      <span class="price">${fmt(it.price*q)}</span></li>`; }).join("");
  return `<h2 id="sheet-title">Mi ronda</h2><p style="margin-top:4px">Arma tu ronda y muéstrasela a quien te atienda.</p>
    ${ids.length?`<ul class="r-list">${rows}</ul><div class="total"><span>Total aproximado</span><span class="price">${fmt(total)}</span></div>
    <p class="hint">Confirma disponibilidad y precios en barra.</p><div class="sheet-foot"><button class="btn" type="button" id="r-clear">Vaciar ronda</button><span></span></div>`
    :`<p class="hint">Todavía no has agregado nada. Toca el corazón de cualquier producto.</p>`}`;
}
function updateRonda(){
  const n = Object.values(ronda).reduce((a,b)=>a+b,0);
  $("#ronda-n").textContent = n; $("#ronda-btn").hidden = n === 0;
  document.querySelectorAll("[data-heart]").forEach(b => { const on = !!ronda[b.dataset.heart]; b.setAttribute("aria-pressed",on); b.setAttribute("aria-label",(on?"Quitar de":"Agregar a")+" mi ronda"); });
  store.set("social-ronda", ronda);
}
function toggleRonda(id, btn){
  if(ronda[id]) delete ronda[id]; else ronda[id] = 1;
  updateRonda();
  if(btn){ btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.heart) return toggleRonda(d.heart, t);
  if(d.open) return openSheet(detailHTML(ALL[d.open]));
  if(d.flavor){ activeFlavors.has(d.flavor) ? activeFlavors.delete(d.flavor) : activeFlavors.add(d.flavor); t.setAttribute("aria-pressed", activeFlavors.has(d.flavor)); return applyFlavors(); }
  if(t.id === "flavor-reset"){ activeFlavors.clear(); document.querySelectorAll("[data-flavor]").forEach(b=>b.setAttribute("aria-pressed","false")); return applyFlavors(); }
  if(d.quiz !== undefined || t.id === "btn-quiz-top") return startQuiz();
  if(d.qopt !== undefined){ quiz.answers = (quiz.answers||[]).slice(0, quiz.path.length); quiz.answers.push(quiz.cur.q.opts[+d.qopt]); return answer(+d.qopt); }
  if(d.qback !== undefined) return back();
  if(d.qother !== undefined){ quiz.idx++; return renderResult(); }
  if(d.casa){ quiz.list.unshift(ALL[d.casa]); quiz.idx = 0; return renderResult(); }
  if(d.alt){ quiz.idx = quiz.list.findIndex(x=>x.id===d.alt); return renderResult(); }
  if(d.toggleRonda){ toggleRonda(d.toggleRonda); return d.fromQuiz!==undefined ? renderResult() : ($("#sheet-body").innerHTML = detailHTML(ALL[d.toggleRonda])); }
  if(t.id === "ronda-btn") return openSheet(rondaHTML());
  if(d.q){ ronda[d.q] = (ronda[d.q]||0) + (+d.d); if(ronda[d.q] <= 0) delete ronda[d.q]; updateRonda(); $("#sheet-body").innerHTML = rondaHTML(); if(!Object.keys(ronda).length) closeSheet(); return; }
  if(t.id === "r-clear"){ ronda = {}; updateRonda(); return closeSheet(); }
  if(t.id === "sheet-x") return closeSheet();
  if(t.id === "btn-search"){
    const box = $("#search-box"), open = box.hidden; box.hidden = !open; t.setAttribute("aria-expanded", open);
    if(open) $("#q").focus(); else { $("#q").value = ""; route(); }
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });
$("#q").addEventListener("input", route);
$("#tabs").addEventListener("click", e => { if(e.target.closest(".tab") && $("#q").value){ $("#q").value = ""; } });
window.addEventListener("hashchange", route);

route(); updateRonda();
</script>

</body>
